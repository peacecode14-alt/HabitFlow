<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17243d">
  <meta name="description" content="Create your HabitFlow account or sign in.">
  <title>Account · HabitFlow</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <style>
    .auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
    .auth-wrap{width:min(100%,440px)}.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;color:var(--text);text-decoration:none;font-weight:800;font-size:20px}
    .auth-brand img{width:42px;height:42px}.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,34px);box-shadow:var(--shadow)}
    .auth-card h1{font-size:24px;margin:5px 0 8px}.auth-subtitle{color:var(--muted);font-size:13px;margin:0 0 22px}
    .auth-tabs{display:flex;gap:6px;background:var(--panel2);padding:5px;border-radius:10px;margin-bottom:20px}.auth-tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:7px;font-weight:700}.auth-tabs button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
    .auth-form label{display:block;font-size:12px;font-weight:700;margin:14px 0 7px}.auth-form input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px}.auth-form input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
    .auth-submit{width:100%;margin-top:20px}.auth-message{min-height:20px;margin:14px 0 0;font-size:12px;color:var(--muted)}.auth-message.error{color:var(--red)}.auth-message.success{color:var(--accent)}
    .auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}.auth-links button,.auth-back{border:0;background:none;color:var(--accent);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
    .auth-user{display:none}.auth-user.visible{display:block}.auth-form.hidden{display:none}.auth-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px}
  </style>
</head>
<body>
  <main class="auth-page">
    <div class="auth-wrap">
      <a class="auth-brand" href="./index.html"><img src="./assets/icons/icon-192.png" alt=""><span>HabitFlow</span></a>
      <section class="auth-card" aria-labelledby="authTitle">
        <p class="eyebrow" id="authEyebrow">YOUR HABITS, YOUR ACCOUNT</p>
        <h1 id="authTitle">Welcome back</h1>
        <p class="auth-subtitle" id="authSubtitle">Sign in to your HabitFlow account.</p>
        <div class="auth-tabs" role="tablist" aria-label="Account action" id="authTabs">
          <button type="button" id="signInTab" role="tab" aria-selected="true">Sign in</button>
          <button type="button" id="signUpTab" role="tab" aria-selected="false">Create account</button>
        </div>
        <form class="auth-form" id="authForm">
          <div id="nameField" hidden><label for="displayName" id="nameLabel">Name</label><input id="displayName" name="name" autocomplete="name" maxlength="60"></div>
          <label for="email" id="emailLabel">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
          <label for="password" id="passwordLabel">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
          <div id="confirmField" hidden><label for="confirmPassword" id="confirmLabel">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></div>
          <button class="primary-button auth-submit" type="submit" id="submitButton">Sign in</button>
        </form>
        <div class="auth-links" id="authLinks"><button type="button" id="forgotButton">Forgot password?</button><a href="./index.html" class="auth-back" id="backLink">Back to HabitFlow</a></div>
        <section id="recoveryPanel" hidden>
          <form class="auth-form" id="recoveryForm">
            <label for="newPassword" id="newPasswordLabel">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
            <label for="confirmNewPassword" id="confirmNewPasswordLabel">Confirm new password</label>
            <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required>
            <button class="primary-button auth-submit" type="submit" id="savePasswordButton">Save new password</button>
          </form>
        </section>
        <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
        <section class="auth-user" id="signedInPanel">
          <p id="signedInAs"></p>
          <button class="primary-button auth-submit" id="continueButton" type="button">Continue to HabitFlow</button>
          <button class="secondary-button auth-submit" id="signOutButton" type="button">Sign out</button>
        </section>
        <p class="auth-note" id="authNote">Your account is secured by Supabase. Your habit data remains on this device for now; account-based cloud sync will be added in the next stage.</p>
      </section>
    </div>
  </main>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
